; Grenzen fuer den Bilderupload in admin.php.
; Strato liest diese Datei je Verzeichnis ein; ohne sie gelten rund 2 MB
; je Datei, was fuer Fotos aus einer Kamera nicht reicht.

upload_max_filesize = 40M
post_max_size = 256M
max_file_uploads = 60
memory_limit = 384M
max_execution_time = 300
max_input_time = 300
